name: Measure trees

on:
  push:
    branches: ['measure/**']

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: measure-linux
          evict-old-files: job
      - name: Install lavapipe and the SDL audio and XRandR development files
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers libpipewire-0.3-dev libpulse-dev libasound2-dev libxrandr-dev
      - run: bash .github/measure/run.sh
        env:
          ANYPS5_REQUIRE_VULKAN: 1
          GALLIUM_OVERRIDE_CPU_CAPS: avx
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: measure-linux
          path: measure-logs/
