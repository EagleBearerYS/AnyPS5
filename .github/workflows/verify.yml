name: Verify finding

on:
  push:
    branches: ['verify/**']

permissions:
  contents: read

env:
  CONFIGURE: >-
    -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
    -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
    -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 50
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: verify-linux
          evict-old-files: job
      - name: Install lavapipe and the SDL audio and XRandR development files
        run: |
          layers=""
          grep -q '^VALIDATION=1' .github/verify/config.sh && layers="vulkan-validationlayers vulkan-tools"
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers libpipewire-0.3-dev libpulse-dev libasound2-dev libxrandr-dev $layers
      - run: cmake -S . -B build $CONFIGURE -DANYPS5_ENABLE_SPIRV_TOOLS=ON
      - run: bash .github/verify/run.sh
        env:
          ANYPS5_REQUIRE_VULKAN: 1
          GALLIUM_OVERRIDE_CPU_CAPS: avx
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: verify-linux
          path: verify-logs/

  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      WINLIBS_RELEASE: 15.2.0posix-14.0.0-ucrt-r7
      WINLIBS_ZIP: winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 50
      - name: Use Git's CA bundle (mingw64 before Git 2.56, ucrt64 after)
        run: |
          for bundle in ucrt64/etc/ssl/certs mingw64/etc/ssl/certs usr/ssl/certs; do
            if [ -f "/c/Program Files/Git/$bundle/ca-bundle.crt" ]; then
              echo "SSL_CERT_FILE=$(cygpath -w "/c/Program Files/Git/$bundle/ca-bundle.crt")" >> "$GITHUB_ENV"
              echo "CA bundle: /c/Program Files/Git/$bundle/ca-bundle.crt"
              break
            fi
          done
      - id: toolchain
        uses: actions/cache@v6
        with:
          path: C:\winlibs
          key: ${{ env.WINLIBS_ZIP }}
      - if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" "https://github.com/brechtsanders/winlibs_mingw/releases/download/$WINLIBS_RELEASE/$WINLIBS_ZIP"
          7z x "$RUNNER_TEMP/winlibs.zip" -oC:/winlibs > /dev/null
      - run: echo 'C:\winlibs\mingw64\bin' >> "$GITHUB_PATH"
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: verify-windows
          evict-old-files: job
      - shell: cmd
        run: cmake -S . -B build %CONFIGURE%
      - run: bash .github/verify/run.sh
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: verify-windows
          path: verify-logs/
